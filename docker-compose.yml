version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartbin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartbin
    ports:
      - "15432:5432"
    volumes:
      - smartbin_pgdata:/var/lib/postgresql/data

volumes:
  smartbin_pgdata:
